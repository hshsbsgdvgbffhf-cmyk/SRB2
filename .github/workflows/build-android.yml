name: Build SRB2 Mobile APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Locate and Build with Gradle
        run: |
          # Localiza automaticamente a pasta onde o gradlew está e entra nela
          GRADLE_DIR=$(find . -name "gradlew" -exec dirname {} \; | head -n 1)
          echo "Projeto Android encontrado em: $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: srb2-android-release
          path: '**/build/outputs/apk/release/*.apk'
          
